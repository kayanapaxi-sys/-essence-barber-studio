<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserva — ESSENCE Barber Studio</title>
<style>
body{margin:0;background:#08090b;color:#f4f4f2;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:560px;margin:auto;padding:30px 18px}.brand{text-align:center;font-size:30px;letter-spacing:8px}.sub{text-align:center;letter-spacing:4px;color:#858991;font-size:10px}.card{margin-top:28px;background:#12151a;border:1px solid #30343a;border-radius:20px;padding:24px}h2{font-weight:400}label{display:block;margin:13px 0 0;color:#ccc;font-size:13px}input,select{width:100%;box-sizing:border-box;background:#0b0d0f;color:#fff;border:1px solid #363a40;border-radius:10px;padding:12px;margin-top:6px}.btn{width:100%;padding:13px;border-radius:10px;border:0;background:#d8d9db;color:#101113;margin-top:20px;font-weight:700}.muted{color:#92979f}.ok{background:#143323;border:1px solid #286b4a;padding:14px;border-radius:10px;margin-top:18px;display:none}.step{color:#888;text-transform:uppercase;letter-spacing:2px;font-size:11px;margin-top:22px}
</style></head><body><div class="wrap"><div class="brand">ESSENCE</div><div class="sub">BARBER STUDIO</div><div class="card"><h2>Reserva tu cita</h2><p class="muted">Una atención pensada para ti.</p>
<div class="step">1 · Tus datos</div><label>Nombre<input id="name" required></label><label>WhatsApp<input id="phone" placeholder="+591 ..."></label><label>Fecha de cumpleaños <span class="muted">(opcional)</span><input id="birthdate" type="date"></label>
<div class="step">2 · Tu servicio</div><label>Servicio<select id="service"></select></label><label>Barbero<select id="barber"></select></label>
<div class="step">3 · Fecha y hora</div><label>Fecha<input id="date" type="date"></label><label>Hora<select id="time"></select></label><button class="btn" id="reserve">Solicitar reserva</button><div class="ok" id="ok"></div></div></div>
<script>
const WA='59157388210', service=document.getElementById('service'),barber=document.getElementById('barber'),time=document.getElementById('time'),date=document.getElementById('date');
const demo={services:[{name:'Corte',price:50},{name:'Barba',price:30},{name:'Limpieza facial',price:70},{name:'Ondulado',price:150}],barbers:[{name:'Kayana'},{name:'Barbero 2'},{name:'Barbero 3'}]};
date.value=new Date().toISOString().slice(0,10);let cfg=JSON.parse(localStorage.getItem('essenceConfig')||'null'),sb=cfg?.url&&cfg?.key?supabase.createClient(cfg.url,cfg.key):null;
async function load(){let s=demo.services,b=demo.barbers;if(sb){let a=await sb.from('services').select('name,price');if(!a.error&&a.data?.length)s=a.data;let q=await sb.from('barbers').select('name');if(!q.error&&q.data?.length)b=q.data}service.innerHTML=s.map(x=>`<option>${x.name} — Bs. ${Number(x.price).toFixed(2)}</option>`).join('');barber.innerHTML=b.map(x=>`<option>${x.name}</option>`).join('');for(let h=9;h<=19;h++)time.innerHTML+=`<option>${String(h).padStart(2,'0')}:00</option>`)}
reserve.onclick=async()=>{let n=name.value.trim(),p=phone.value.trim(),svc=service.value.split(' — ')[0];if(!n||!p)return alert('Completa tu nombre y WhatsApp.');let payload={client_name:n,phone:p,birthdate:birthdate.value||null,service_name:svc,barber_name:barber.value,date:date.value,time:time.value,status:'Solicitada'};try{if(sb){let {error}=await sb.from('appointments').insert(payload);if(error)throw error}else{let a=JSON.parse(localStorage.getItem('essencePublicRequests')||'[]');a.push(payload);localStorage.setItem('essencePublicRequests',JSON.stringify(a))}let msg=`Hola, quiero reservar en ESSENCE Barber Studio.%0A%0ANombre: ${encodeURIComponent(n)}%0AServicio: ${encodeURIComponent(svc)}%0ABarbero: ${encodeURIComponent(barber.value)}%0AFecha: ${encodeURIComponent(date.value)}%0AHora: ${encodeURIComponent(time.value)}`;ok.style.display='block';ok.innerHTML=`Reserva solicitada. <br><a style="color:#8de2b5" target="_blank" href="https://wa.me/${WA}?text=${msg}">Confirmar por WhatsApp</a>`}catch(e){alert(e.message||'No se pudo registrar la reserva.')}};load();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></body></html>
